<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 | 个人博客</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#3b82f6', darkBg: '#121826', darkCard: '#1e293b' } } } }
  </script>
  <style>html.dark{color-scheme:dark;}body{transition:0.3s;}</style>
</head>
<body class="bg-gray-100 dark:bg-darkBg min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white dark:bg-darkCard rounded-xl shadow-xl p-8 border border-gray-200 dark:border-gray-700">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold text-gray-800 dark:text-white">账号注册</h2>
      <button id="themeBtn" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700">🌙</button>
    </div>
    <div class="space-y-4">
      <input type="text" id="username" placeholder="用户名" class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary">
      <input type="password" id="pwd" placeholder="密码" class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary">
      <input type="text" id="nickname" placeholder="昵称" class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-800 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary">
      <button onclick="reg()" class="w-full py-3 bg-primary text-white rounded-lg hover:bg-primary/90 transition font-medium">完成注册</button>
    </div>
    <p class="mt-6 text-center text-gray-600 dark:text-gray-400">已有账号？<a href="/login.html" class="text-primary hover:underline">立即登录</a></p>
  </div>

  <script>
    const html = document.documentElement, themeBtn = document.getElementById('themeBtn');
    function initTheme(){let t=localStorage.getItem('blogTheme')||'light';html.className=t;themeBtn.textContent=t==='dark'?'☀️':'🌙';}
    themeBtn.onclick=()=>{let n=html.classList.contains('dark')?'light':'dark';html.className=n;localStorage.setItem('blogTheme',n);themeBtn.textContent=n==='dark'?'☀️':'🌙';};
    initTheme();

    async function reg(){
      const username=document.getElementById('username').value.trim();
      const password=document.getElementById('pwd').value.trim();
      const nickname=document.getElementById('nickname').value.trim();
      if(!username||!password||!nickname)return alert('所有字段不能为空');
      const res=await fetch('/api/register',{
        method:'POST',
        headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body:`username=${username}&password=${password}&nickname=${nickname}`
      });
      const {code,msg}=await res.json();
      alert(msg);
      if(code===200)location.href='/login.html';
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客后台管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f4f5f7;
            padding-top: 80px;
            text-align: center;
        }
        .container {
            width: 420px;
            margin: 0 auto;
            background: #fff;
            padding: 40px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        h2 {
            color: #333;
            margin-bottom: 35px;
            font-size: 24px;
        }
        .menu-item {
            display: block;
            width: 100%;
            line-height: 48px;
            background-color: #2d8cf0;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            margin: 12px 0;
            transition: background 0.2s;
        }
        .menu-item:hover {
            background-color: #1b76d8;
        }
        .logout {
            background-color: #f56c6c;
        }
        .logout:hover {
            background-color: #e05555;
        }
        .back-index {
            margin-top: 20px;
            color: #666;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>博客管理中心</h2>
        <a href="article.html" class="menu-item">📝 文章管理</a>
        <a href="category.html" class="menu-item">📂 分类管理</a>
        <a href="comment.html" class="menu-item">💬 评论管理</a>
        <a href="/login.html" class="menu-item logout">🚪 退出登录</a>
        <!-- 返回博客首页 -->
        <a href="/" class="back-index">← 返回博客首页</a>
    </div>
</body>
</html>
